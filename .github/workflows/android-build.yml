name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck & Build Web Assets
        run: |
          npm run lint
          npm run build

      - name: Initialize Capacitor Android & Inject Custom Widgets
        run: |
          npx cap add android
          node scripts/setup-android.js

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Locate and Prepare Debug APK
        id: apk-prep
        run: |
          mkdir -p output-apk
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="output-apk/Next1111-WorldClock-debug-build-${{ github.run_number }}.apk"
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            APK_SIZE=$(du -h "$APK_DEST" | cut -f1)
            echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
            echo "Found APK at $APK_SRC, copied to $APK_DEST (Size: $APK_SIZE)"
          else
            echo "Error: Debug APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next1111-Debug-APK-build-${{ github.run_number }}
          path: output-apk/*.apk
          retention-days: 30

      - name: Generate Action Summary
        run: |
          echo "## 📱 Android Debug Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Succeeded |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Run** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | ${{ steps.apk-prep.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`Next1111-WorldClock-debug-build-${{ github.run_number }}.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK directly from the **Artifacts** section at the top of this run page." >> $GITHUB_STEP_SUMMARY
