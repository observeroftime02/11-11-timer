name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Assets
        run: |
          npm run lint
          npm run build

      - name: Initialize Capacitor Android & Inject Custom Widgets
        run: |
          npx cap add android
          node scripts/setup-android.js

      - name: Build Debug/Unsigned APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Prepare Release APK Asset
        id: prep-apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release-output
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="release-output/Next1111-WorldClock-${TAG}.apk"
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Error: APK not found at $APK_SRC"
            exit 1
          fi

      - name: Create GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep-apk.outputs.tag }}
          name: "Next 11:11 & 4:20 World Clock ${{ steps.prep-apk.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.prep-apk.outputs.apk_path }}
          body: |
            ### 🌟 Next 11:11 & 4:20 World Clock - Android Build
            
            Download the attached `.apk` file below directly to your Android device to install or update the app.
            
            **Included Features:**
            - 🌍 Synchronized 11:11 & 4:20 global countdowns & world timezone map
            - 🔔 Crystal Harmonic & Mellow Chill notification chimes
            - 📱 6 Custom Android Home Screen Widgets (1x4, 2x2, 2x4 for both 11:11 and 4:20)
            - 🎨 Adaptive app icon suite & Wish Queuing system
