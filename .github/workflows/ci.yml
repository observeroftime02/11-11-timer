name: Web App CI & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run lint

      - name: Production Vite Build
        run: npm run build

      - name: Verify Audio & Asset Files
        run: |
          test -f public/chime.wav || { echo "Missing chime.wav"; exit 1; }
          test -f public/chime-420.wav || { echo "Missing chime-420.wav"; exit 1; }
          test -f public/icon.svg || { echo "Missing icon.svg"; exit 1; }
          test -f dist/index.html || { echo "Build did not produce dist/index.html"; exit 1; }
          echo "All critical assets and build outputs verified successfully."
