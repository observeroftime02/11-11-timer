<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#minBg)" stroke="#27272a" stroke-width="6" />

  <!-- Clean outer ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Subtle tick marks at 12, 3, 6, 9 -->
  <line x1="256" y1="76" x2="256" y2="92" stroke="#e4e4e7" stroke-width="3" stroke-linecap="round" />
  <line x1="436" y1="256" x2="420" y2="256" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="436" x2="256" y2="420" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
  <line x1="76" y1="256" x2="92" y2="256" stroke="#71717a" stroke-width="3" stroke-linecap="round" />

  <!-- 11:11 Typography -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="114" font-weight="900" fill="#fafafa" text-anchor="middle" letter-spacing="-3">11:11</text>

  <!-- Glowing Amber Synchronized Pulse Dot -->
  <circle cx="380" cy="216" r="7" fill="#f59e0b" />
  <circle cx="380" cy="216" r="14" fill="#f59e0b" opacity="0.25" />

  <!-- Bottom Coordinates -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">EARTH TIME</text>
</svg>
