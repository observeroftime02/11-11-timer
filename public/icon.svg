<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#goldBg)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="6" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#goldRadial)" />

  <!-- Orbital World Meridians -->
  <ellipse cx="256" cy="256" rx="180" ry="85" fill="none" stroke="#f59e0b" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="8 6" transform="rotate(-25 256 256)" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="2.5" />
  
  <!-- Subtle Clock Tick Dots -->
  <circle cx="256" cy="88" r="4.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="424" cy="256" r="4.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="256" cy="424" r="4.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="88" cy="256" r="4.5" fill="#f59e0b" opacity="0.6" />

  <!-- 11:11 Main Typography -->
  <g filter="url(#glowGold)">
    <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="112" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-3">11:11</text>
  </g>

  <!-- Bottom Sub-badge -->
  <rect x="166" y="324" width="180" height="28" rx="14" fill="#292524" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="256" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="3">WORLD CLOCK</text>
</svg>
