<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#051b14" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#emeraldBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="6" />

  <!-- Circular Dial Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- 11:11 Typography -->
  <g filter="url(#glowEmerald)">
    <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="112" font-weight="900" fill="url(#emeraldGrad)" text-anchor="middle" letter-spacing="-3">11:11</text>
  </g>

  <!-- Bottom Label Pill -->
  <rect x="176" y="324" width="160" height="26" rx="13" fill="#065f46" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">GLOBAL CLOCK</text>
</svg>
