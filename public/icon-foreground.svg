<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="fgAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="fgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow in safe area (center: 54, 54, radius 36) -->
  <circle cx="54" cy="54" r="34" fill="url(#fgAmbient)" />

  <!-- Orbital Rings & Meridians -->
  <circle cx="54" cy="54" r="30" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="0.8" />
  <ellipse cx="54" cy="54" rx="31" ry="14" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 1.5" transform="rotate(-25 54 54)" />
  
  <!-- Subtle Dial Tick Dots -->
  <circle cx="54" cy="25" r="1.2" fill="#fbbf24" opacity="0.8" />
  <circle cx="83" cy="54" r="1.2" fill="#fbbf24" opacity="0.8" />
  <circle cx="54" cy="83" r="1.2" fill="#fbbf24" opacity="0.8" />
  <circle cx="25" cy="54" r="1.2" fill="#fbbf24" opacity="0.8" />

  <!-- Centered 11:11 Typography -->
  <g filter="url(#fgGlow)">
    <text x="54" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="-0.8">11:11</text>
  </g>

  <!-- Subtitle Pill -->
  <rect x="36" y="66" width="36" height="6.5" rx="3.25" fill="#292524" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="0.5" />
  <text x="54" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.2" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="0.8">WORLD CLOCK</text>
</svg>
