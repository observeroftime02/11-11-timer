<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cosmicGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="glowCosmic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#cosmicBg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="5" />

  <!-- Nebula Dust -->
  <circle cx="256" cy="220" r="200" fill="url(#nebula)" />

  <!-- Stars -->
  <circle cx="120" cy="140" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="390" cy="120" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="100" cy="380" r="2" fill="#a5f3fc" opacity="0.7" />
  <circle cx="410" cy="360" r="2.5" fill="#c084fc" opacity="0.8" />
  <circle cx="256" cy="90" r="3.5" fill="#fef08a" opacity="0.9" />

  <!-- Celestial Rings & Globe Coordinates -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="2" />
  <ellipse cx="256" cy="256" rx="185" ry="90" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6" transform="rotate(35 256 256)" />
  <ellipse cx="256" cy="256" rx="90" ry="185" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- 11:11 Glowing Numeral -->
  <g filter="url(#glowCosmic)">
    <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="114" font-weight="900" fill="url(#cosmicGlow)" text-anchor="middle" letter-spacing="-3">11:11</text>
  </g>

  <!-- Subtitle -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="4">CELESTIAL TIME</text>
</svg>
